<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disclosure Trainer for Interpreters</title>
<style>
  :root{
    --bg:#fbfaf8; --card:#fff; --ink:#1a1a18; --muted:#77746d;
    --line:#e8e5df; --accent:#2f5d50; --soft:#eef3f1; --warn:#8a5a2b; --hot:#b4472e;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#15150f;--card:#1e1e19;--ink:#eceae4;--muted:#96938a;--line:#31302a;
      --accent:#83b7a4;--soft:#232f2b;--warn:#c99a5f;--hot:#e0836a;}
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","PingFang TC",sans-serif}
  .wrap{max-width:720px;margin:0 auto;padding:0 20px}

  /* 顶部一条渐变细线，整站唯一的装饰 */
  body::before{content:"";position:fixed;top:0;left:0;right:0;height:3px;z-index:9;
    background:linear-gradient(90deg,var(--accent),var(--hot) 45%,var(--accent))}
  /* header */
  header{padding:30px 0 0}
  h1{margin:0;font-size:17px;font-weight:600;letter-spacing:.2px;
    display:inline-flex;align-items:center;gap:10px}
  h1::before{content:"";width:15px;height:15px;border-radius:4px;flex:none;
    background:linear-gradient(135deg,var(--accent),var(--hot));
    transform:rotate(12deg)}
  .nav{display:flex;align-items:center;gap:18px;padding:20px 0 0;flex-wrap:wrap}
  .nav a{font-size:13.5px;color:var(--muted);cursor:pointer;text-decoration:none;
    padding-bottom:7px;border-bottom:2px solid transparent}
  .nav a:hover{color:var(--ink)}
  .nav a.on{color:var(--ink);border-bottom-color:var(--accent)}
  .nav .sp{flex:1}
  .rule{height:1px;background:var(--line);margin-bottom:22px}

  /* quiet text buttons */
  .tools{display:flex;gap:16px;flex-wrap:wrap;align-items:center;
    font-size:12.5px;color:var(--muted);padding:0 0 18px}
  .tools span{cursor:pointer}
  .tools span:hover{color:var(--accent)}
  .tools .dot{cursor:default;opacity:.4}

  /* controls */
  select,input[type=text]{font:inherit;font-size:13px;padding:6px 9px;border:1px solid var(--line);
    border-radius:7px;background:var(--card);color:var(--ink)}
  select:focus,input:focus{outline:none;border-color:var(--accent)}
  button{font:inherit;font-size:13px;padding:7px 14px;border:1px solid var(--line);
    background:var(--card);color:var(--ink);border-radius:7px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button:disabled{opacity:.35;cursor:default}
  button.pri{background:var(--accent);color:var(--bg);border-color:var(--accent)}
  button.rec{border-color:var(--hot);color:var(--hot)}
  button.rec.active{background:var(--hot);color:#fff;border-color:var(--hot)}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

  /* settings drawer */
  .drawer{display:none;background:var(--soft);border-radius:10px;padding:16px 18px;
    margin-bottom:22px;font-size:13px}
  .drawer.open{display:block}
  .drawer .line{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .drawer .line:last-child{margin-bottom:0}
  .drawer label{display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--ink)}
  .drawer input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}
  input[type=range]{width:120px;accent-color:var(--accent);vertical-align:middle}

  /* card */
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:30px 30px 26px;position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,var(--accent),transparent 70%)}
  .box{position:relative;overflow:hidden}
  .box::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;
    background:linear-gradient(180deg,var(--accent),transparent)}
  .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    font-size:12px;color:var(--muted);margin-bottom:22px}
  .tag{color:var(--accent)}

  /* 步骤：左侧一条细轴，当前步骤亮起 */
  .step{margin-bottom:26px;padding-left:26px;position:relative}
  .step:last-of-type{margin-bottom:0}
  .step::before{content:"";position:absolute;left:7px;top:20px;bottom:-26px;
    width:1px;background:var(--line)}
  .step:last-of-type::before{display:none}
  .step h3{margin:0 0 11px;font-size:11.5px;font-weight:600;color:var(--muted);
    letter-spacing:.8px;text-transform:uppercase;position:relative}
  .step h3::before{content:"";position:absolute;left:-26px;top:5px;
    width:9px;height:9px;border-radius:50%;background:var(--bg);
    border:1.5px solid var(--line);box-sizing:border-box}
  .step.active h3{color:var(--accent)}
  .step.active h3::before{background:var(--accent);border-color:var(--accent);
    box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}

  .src{font-size:19px;line-height:1.75;margin:0}
  .tgt{font-size:17px;line-height:1.9;margin:0}
  .num{color:var(--hot)}
  .pad{width:100%;min-height:130px;font-size:15px;line-height:1.9;padding:13px 14px;
    border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);
    resize:vertical;font-family:ui-monospace,Menlo,"PingFang SC",monospace}
  .pad:focus{outline:none;border-color:var(--accent)}
  .box{background:var(--soft);border-radius:9px;padding:16px 18px;margin-top:10px}
  .box .lbl{font-size:11px;color:var(--muted);letter-spacing:.6px;
    text-transform:uppercase;margin-bottom:6px}
  .chunk{padding:6px 0;font-size:18px;line-height:1.7}
  .chunk.off{opacity:.25}

  .foot{border-top:1px solid var(--line);margin-top:26px;padding-top:20px}
  .keys{font-size:11.5px;color:var(--muted);margin-top:18px;line-height:2.1}
  kbd{font-family:ui-monospace,Menlo,monospace;font-size:11px;border:1px solid var(--line);
    border-bottom-width:2px;border-radius:4px;padding:1px 6px;background:var(--bg)}

  /* list mode */
  .item{border-bottom:1px solid var(--line);padding:20px 0}
  .item:last-child{border-bottom:0}
  .item .src{font-size:16px;line-height:1.7}
  .item .tgt{font-size:15.5px;color:var(--muted);margin-top:9px;cursor:pointer}
  .item .tgt.hidden{color:transparent;text-shadow:0 0 8px rgba(128,128,120,.5);user-select:none}
  .item.done{opacity:.4}

  dialog{border:1px solid var(--line);border-radius:12px;padding:24px;max-width:640px;width:92%;
    background:var(--card);color:var(--ink)}
  dialog::backdrop{background:rgba(0,0,0,.35)}
  dialog textarea{width:100%;min-height:80px;font:inherit;font-size:14px;padding:10px;
    border:1px solid var(--line);border-radius:8px;margin-bottom:12px;resize:vertical;
    background:var(--bg);color:var(--ink)}
  dialog label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px}
  .warnbox{padding:11px 13px;border:1px solid var(--warn);border-radius:8px;
    line-height:1.6;font-size:11.5px;color:var(--warn);margin-bottom:16px}
  .empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:14px;line-height:2}
  .note{font-size:11.5px;color:var(--warn);margin-top:10px}
  footer{padding:34px 0 40px;font-size:11.5px;color:var(--muted);text-align:center}

  @media (max-width:560px){
    .card{padding:22px 20px}.src{font-size:17px}.tgt{font-size:16px}.focus .src{font-size:17px}
  }
  @media print{
    .nav,.tools,.drawer,.foot,.keys,footer,button,audio,.meta{display:none!important}
    body{background:#fff;color:#000}
    .card,.item{border:0;border-bottom:1px solid #ccc;border-radius:0;padding:12px 0;
      break-inside:avoid}
    .tgt.hidden{color:#000!important;text-shadow:none!important}
    .num{color:#000}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="h1"></h1>
    <nav class="nav">
      <a id="m-focus" class="on"></a>
      <a id="m-list"></a>
      <span class="sp"></span>
      <a id="ui">中文</a>
    </nav>
  </header>
  <div class="rule"></div>

  <div class="row" style="margin-bottom:16px">
    <select id="cat"></select>
    <input type="text" id="q" style="flex:1;min-width:120px">
  </div>

  <div class="tools">
    <span id="t-add"></span><span class="dot">·</span>
    <span id="t-imp"></span><span class="dot">·</span>
    <span id="t-exp"></span><span class="dot">·</span>
    <span id="t-prt"></span><span class="dot">·</span>
    <span id="t-set"></span><span class="dot">·</span>
    <span id="t-script"></span>
    <span class="sp" style="flex:1"></span>
    <span id="t-count" class="dot"></span>
  </div>

  <div class="drawer" id="drawer">
    <div class="line">
      <label><input type="checkbox" id="c-due" checked><span id="l-due"></span></label>
      <label><input type="checkbox" id="c-done"><span id="l-done"></span></label>
      <label><input type="checkbox" id="c-shuffle"><span id="l-shuffle"></span></label>
      <label><input type="checkbox" id="c-split"><span id="l-split"></span></label>
      <label><input type="checkbox" id="c-hl" checked><span id="l-hl"></span></label>
    </div>
    <div class="line">
      <span id="l-speed" class="muted"></span>
      <input type="range" id="rate" min="0.5" max="1.6" step="0.1" value="1">
      <span id="rateval" class="muted">1.0x</span>
    </div>
  </div>

  <div id="view"></div>
  <footer id="ft"></footer>
</div>

<dialog id="dlg"><form method="dialog">
  <div class="warnbox" id="lb-warn"></div>
  <label id="lb-cat"></label>
  <input type="text" id="f-cat" style="width:100%;margin-bottom:13px">
  <label id="lb-en"></label><textarea id="f-en"></textarea>
  <label id="lb-zh"></label><textarea id="f-zh"></textarea>
  <label id="lb-zht"></label><textarea id="f-zht"></textarea>
  <div class="row" style="margin-top:4px">
    <button value="save" class="pri" id="lb-save"></button>
    <button value="cancel" id="lb-cancel"></button>
    <button value="delete" id="f-del" style="margin-left:auto;color:var(--hot)"></button>
  </div>
</form></dialog>

<script>
const T={
en:{title:"Disclosure Trainer for Interpreters",focus:"Practice",list:"All passages",
 allCat:"All categories",search:"Search",
 add:"Add",imp:"Import",exp:"Export",print:"Print",settings:"Settings",
 simp:"Simplified",trad:"Traditional",
 due:"Due only",done:"Include mastered",shuffle:"Shuffle",split:"Split sentences",
 hl:"Highlight numbers",speed:"Playback speed",
 count:(d,a)=>`${d} due · ${a} total`,
 s1:"Listen",s2:"Notes",s3:"Interpret and record",s4:"Check",
 play:"Play",pause:"Pause",resume:"Resume",nextSent:"Next sentence",
 padPh:"Take notes as you listen. Symbols, abbreviations, vertical layout, whatever works. Only you read this.",
 escHint:"Press Esc to leave the notepad so keyboard shortcuts work again.",
 recStart:"Record",recStop:"Stop",download:"Download",
 micFile:"Browsers block the microphone on local files. Recording works once this is hosted.",
 showSrc:"Show source",hideSrc:"Hide source",showTgt:"Show reference",hideTgt:"Hide reference",
 lblSrc:"Source",lblTgt:"Reference rendering",
 noTgt:"No reference rendering yet. Use Edit to add one.",
 r1:"Hard",r2:"OK",r3:"Easy",rateHint:"How did that go?",
 master:"Mastered",unmaster:"Un-master",isMastered:"mastered",edit:"Edit",
 prev:"Previous",next:"Next",pos:(a,b)=>`${a} of ${b}`,
 keys:"<kbd>R</kbd> play &nbsp; <kbd>P</kbd> pause &nbsp; <kbd>N</kbd> notepad &nbsp; <kbd>Esc</kbd> leave notepad &nbsp; <kbd>V</kbd> record<br><kbd>B</kbd> play back &nbsp; <kbd>S</kbd> source &nbsp; <kbd>Space</kbd> reference &nbsp; <kbd>←</kbd><kbd>→</kbd> move &nbsp; <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> rate",
 empty:"Nothing due right now.<br>Open Settings and turn off “Due only” to see everything.",
 warn:"Standard scripted boilerplate only. <b>Never enter client private information</b>: names, dates of birth, account or member numbers, addresses, phone numbers, medical or case details.",
 fCat:"Category",fEn:"Source text (English)",fZh:"Reference rendering (Simplified Chinese)",
 fZht:"Reference rendering (Traditional Chinese, optional)",
 save:"Save",cancel:"Cancel",del:"Delete",
 foot:"Passages come from public federal model forms. Nothing here is from a real call.",
 impDone:(a,u,s)=>`Import complete\n\n${a} added\n${u} already present (blanks filled, your edits untouched)`+(s?`\n${s} skipped`:""),
 impBad:"That file is not valid JSON."},
zh:{title:"口译员披露段落训练器",focus:"练习",list:"全部段落",
 allCat:"全部类别",search:"搜索",
 add:"新增",imp:"导入",exp:"导出",print:"打印",settings:"设置",
 simp:"简体",trad:"繁體",
 due:"只看到期",done:"含已掌握",shuffle:"随机顺序",split:"拆句",
 hl:"高亮数字",speed:"朗读语速",
 count:(d,a)=>`到期 ${d} · 共 ${a}`,
 s1:"听",s2:"笔记",s3:"口译并录音",s4:"核对",
 play:"播放",pause:"暂停",resume:"继续",nextSent:"下一句",
 padPh:"边听边记。符号、缩写、竖式排列都行，这里只有你自己看。",
 escHint:"写完按 Esc 退出输入，快捷键才会恢复。",
 recStart:"录音",recStop:"停止",download:"下载",
 micFile:"本地打开时浏览器禁止使用麦克风，部署到网站后才能录音。",
 showSrc:"显示原文",hideSrc:"收起原文",showTgt:"显示定稿",hideTgt:"收起定稿",
 lblSrc:"原文",lblTgt:"你的定稿",
 noTgt:"还没填中文定稿，点「新增」旁的编辑补上。",
 r1:"难",r2:"一般",r3:"熟",rateHint:"刚才那段怎么样？",
 master:"已掌握",unmaster:"取消已掌握",isMastered:"已掌握",edit:"编辑",
 prev:"上一段",next:"下一段",pos:(a,b)=>`第 ${a} / ${b} 段`,
 keys:"<kbd>R</kbd> 播放 &nbsp; <kbd>P</kbd> 暂停 &nbsp; <kbd>N</kbd> 进入笔记 &nbsp; <kbd>Esc</kbd> 退出笔记 &nbsp; <kbd>V</kbd> 录音<br><kbd>B</kbd> 回放 &nbsp; <kbd>S</kbd> 原文 &nbsp; <kbd>空格</kbd> 定稿 &nbsp; <kbd>←</kbd><kbd>→</kbd> 翻段 &nbsp; <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 自评",
 empty:"现在没有到期的段落。<br>打开设置，关掉「只看到期」就能看全部。",
 warn:"只填标准声明套话。<b>禁止填入任何客户私人信息</b>：姓名、生日、账号、会员号、地址、电话、病历、案件细节。",
 fCat:"类别",fEn:"英文原文",fZh:"中文定稿（简体）",
 fZht:"中文定稿（繁體，可留空）",
 save:"保存",cancel:"取消",del:"删除",
 foot:"段落取自公开的联邦示范表格，不含任何真实通话内容。",
 impDone:(a,u,s)=>`导入完成\n\n新增 ${a} 段\n已存在 ${u} 段（只补空缺，没有覆盖你改过的内容）`+(s?`\n跳过 ${s} 段`:""),
 impBad:"文件读取失败：不是有效的 JSON。"}
};
let ui=localStorage.getItem("dt_ui")||"en";
const t=k=>T[ui][k];

const SEED=[
 {cat:"Billing disputes",en:"This notice contains important information about your rights and our responsibilities under the Fair Credit Billing Act. Keep this notice for future use.",zh:"本通知载有重要信息，说明您在《公平信用账单法》下享有的权利以及我们所承担的责任。请妥善保存本通知，以备日后查阅。",zht:""},
 {cat:"Billing disputes",en:"If you think your bill is wrong, or if you need more information about a transaction on your bill, write to us at the address listed on your bill as soon as possible. We must hear from you no later than 60 days after we sent you the first bill on which the error or problem appeared.",zh:"如果您认为账单有误，或者需要了解账单上某笔交易的更多信息，请尽快按账单上列明的地址写信给我们。我们必须在您收到首份出现该错误或问题的账单之日起 60 天内收到您的来信。",zht:""},
 {cat:"Lost or stolen card",en:"You will not be liable for any unauthorized use that occurs after you notify us. You may, however, be liable for unauthorized use that occurs before your notice to us. In any case, your liability will not exceed $50.",zh:"在您通知我们之后发生的任何未经授权的使用，您无需承担责任。但在您通知我们之前发生的未经授权的使用，您可能需要承担责任。无论何种情况，您承担的责任上限均为 50 美元。",zht:""}
];

const KEY="disclosure_trainer_v2";
const DAY=864e5;
let data=load(),mode="focus",useT=false,idx=0;
let optSplit=false,optHL=true,optShuffle=false,optDue=true,optDone=false;
let revealed=new Set(),order=null,chunkIdx=0;
let recorder=null,recBlob=null,recFor=null,paused=false;

function load(){
  try{const s=localStorage.getItem(KEY)||localStorage.getItem("disclosure_trainer_v1");
    if(s){const a=JSON.parse(s);
      if(Array.isArray(a)&&a.length)return a.map((d,i)=>({id:d.id??i+1,cat:d.cat||"",
        en:d.en||"",zh:d.zh||"",zht:d.zht||"",mastered:!!d.mastered,
        due:d.due??0,ivl:d.ivl??0,notes:d.notes||""}));}
  }catch(e){}
  return SEED.map((d,i)=>({...d,id:i+1,mastered:false,due:0,ivl:0,notes:""}));
}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tgtOf=d=>useT?((d.zht||"").trim()||d.zh):d.zh;
const isDue=d=>!d.due||d.due<=Date.now();
function mark(s,isEn){let h=esc(s);
  if(optHL&&isEn)h=h.replace(/(\d[\d,.]*\s*%?)/g,'<span class="num">$1</span>');return h}
// 不用后行断言，Safari 16.4 以前不支持；先屏蔽小数点，否则 16.74% 会被拆开
const sentences=s=>{const P="";
  const m=s.replace(/(\d)\.(\d)/g,"$1"+P+"$2");
  return (m.match(/[^.!?]+[.!?]*\s*/g)||[m]).map(x=>x.split(P).join(".").trim()).filter(Boolean)};

function visible(){
  const cat=document.getElementById("cat").value;
  const q=document.getElementById("q").value.trim().toLowerCase();
  let r=data.filter(d=>(optDone||!d.mastered)&&(!optDue||optDone||isDue(d))&&
    (!cat||d.cat===cat)&&(!q||(d.en+d.zh+d.zht).toLowerCase().includes(q)));
  if(optShuffle){if(!order||order.length!==r.length)order=r.map((_,i)=>i).sort(()=>Math.random()-.5);
    r=order.map(i=>r[i]).filter(Boolean)}
  return r;
}

function applyUI(){
  document.documentElement.lang=ui==="en"?"en":(useT?"zh-TW":"zh-CN");
  document.title=t("title");
  const S=(id,txt)=>{const e=document.getElementById(id);if(e)e.textContent=txt};
  S("h1",t("title"));S("m-focus",t("focus"));S("m-list",t("list"));
  S("t-add",t("add"));S("t-imp",t("imp"));S("t-exp",t("exp"));
  S("t-prt",t("print"));S("t-set",t("settings"));S("t-script",useT?t("trad"):t("simp"));
  S("l-due",t("due"));S("l-done",t("done"));S("l-shuffle",t("shuffle"));
  S("l-split",t("split"));S("l-hl",t("hl"));S("l-speed",t("speed"));
  S("lb-cat",t("fCat"));S("lb-en",t("fEn"));S("lb-zh",t("fZh"));S("lb-zht",t("fZht"));
  S("lb-save",t("save"));S("lb-cancel",t("cancel"));S("f-del",t("del"));S("ft",t("foot"));
  document.getElementById("lb-warn").innerHTML=t("warn");
  document.getElementById("q").placeholder=t("search");
  document.getElementById("ui").textContent=ui==="en"?"中文":"EN";
  const dueN=data.filter(d=>!d.mastered&&isDue(d)).length;
  S("t-count",t("count")(dueN,data.length));
  const s=document.getElementById("cat"),c=s.value;
  s.innerHTML=`<option value="">${t("allCat")}</option>`+
    [...new Set(data.map(d=>d.cat).filter(Boolean))]
      .map(x=>`<option${x===c?" selected":""}>${esc(x)}</option>`).join("");
}

function render(){
  applyUI();
  const items=visible(),v=document.getElementById("view");
  if(!items.length){v.innerHTML=`<div class="empty">${t("empty")}</div>`;return}
  mode==="focus"?renderFocus(items,v):renderList(items,v);
}

function renderFocus(items,v){
  idx=Math.max(0,Math.min(idx,items.length-1));
  const d=items[idx],tgt=tgtOf(d),blank=!tgt.trim();
  const cs=optSplit?sentences(d.en):[];
  const seenS=revealed.has("s"+d.id),seenT=revealed.has(d.id);
  const step=!seenS&&!seenT?(recBlob&&recFor===d.id?3:1):4;
  v.innerHTML=`<div class="card">
    <div class="meta">
      <span>${t("pos")(idx+1,items.length)}</span>
      ${d.cat?`<span class="tag">${esc(d.cat)}</span>`:""}
      ${d.mastered?`<span>${t("isMastered")}</span>`:""}
    </div>

    <div class="step ${step===1?"active":""}">
      <h3>1 &nbsp;${t("s1")}${optSplit&&cs.length?` &nbsp;(${chunkIdx+1}/${cs.length})`:""}</h3>
      <div class="row">
        <button data-speak="${d.id}" class="pri">${t("play")}</button>
        <button id="pause">${paused?t("resume"):t("pause")}</button>
        ${optSplit&&cs.length>1?`<button id="cnext">${t("nextSent")}</button>`:""}
      </div>
    </div>

    <div class="step">
      <h3>2 &nbsp;${t("s2")}</h3>
      <textarea class="pad" id="pad" placeholder="${t("padPh")}">${esc(d.notes||"")}</textarea>
      <div class="note" style="color:var(--muted)">${t("escHint")}</div>
    </div>

    <div class="step ${step===3?"active":""}">
      <h3>3 &nbsp;${t("s3")}</h3>
      <div class="row">
        <button id="mic" class="rec ${recorder?"active":""}">${recorder?t("recStop"):t("recStart")}</button>
        ${recBlob&&recFor===d.id?`<audio controls id="pb" src="${recBlob}"></audio>
          <a href="${recBlob}" download="practice.webm"><button>${t("download")}</button></a>`:""}
      </div>
      ${location.protocol==="file:"?`<div class="note">${t("micFile")}</div>`:""}
    </div>

    <div class="step ${step===4?"active":""}">
      <h3>4 &nbsp;${t("s4")}</h3>
      <div class="row">
        <button data-rev="s${d.id}">${seenS?t("hideSrc"):t("showSrc")}</button>
        ${blank?"":`<button data-rev="${d.id}">${seenT?t("hideTgt"):t("showTgt")}</button>`}
      </div>
      ${seenS?`<div class="box"><div class="lbl">${t("lblSrc")}</div>
        ${optSplit?cs.map((c,i)=>`<div class="chunk ${i===chunkIdx?"":"off"}">${mark(c,true)}</div>`).join("")
          :`<p class="src" style="font-size:17px">${mark(d.en,true)}</p>`}</div>`:""}
      ${seenT&&!blank?`<div class="box"><div class="lbl">${t("lblTgt")}</div>
        <p class="tgt">${esc(tgt)}</p></div>`:""}
      ${blank?`<div class="note">${t("noTgt")}</div>`:""}
    </div>

    <div class="foot">
      <div class="row">
        <span class="muted" style="font-size:12px">${t("rateHint")}</span>
        <button data-rate="1">${t("r1")}</button>
        <button data-rate="2">${t("r2")}</button>
        <button data-rate="3">${t("r3")}</button>
        <span style="flex:1"></span>
        <button data-master="${d.id}">${d.mastered?t("unmaster"):t("master")}</button>
        <button data-edit="${d.id}">${t("edit")}</button>
      </div>
      <div class="row" style="margin-top:12px">
        <button id="prev" ${idx===0?"disabled":""}>${t("prev")}</button>
        <button id="next" ${idx===items.length-1?"disabled":""}>${t("next")}</button>
      </div>
      <div class="keys">${t("keys")}</div>
    </div>
  </div>`;
  const g=id=>document.getElementById(id);
  if(g("prev"))g("prev").onclick=()=>go(-1);
  if(g("next"))g("next").onclick=()=>go(1);
  if(g("cnext"))g("cnext").onclick=()=>{chunkIdx=(chunkIdx+1)%cs.length;render()};
  if(g("mic"))g("mic").onclick=()=>toggleRec(d.id);
  if(g("pause"))g("pause").onclick=togglePause;
  const pad=g("pad");
  if(pad){pad.oninput=()=>{d.notes=pad.value;save()};
    pad.onkeydown=e=>{if(e.key==="Escape")pad.blur()}}
}

function renderList(items,v){
  v.innerHTML=items.map(d=>{
    const tgt=tgtOf(d),blank=!tgt.trim(),hide=!blank&&!revealed.has(d.id);
    return `<div class="item ${d.mastered?"done":""}">
      <div class="meta" style="margin-bottom:8px">
        ${d.cat?`<span class="tag">${esc(d.cat)}</span>`:""}
        ${d.mastered?`<span>${t("isMastered")}</span>`:""}
      </div>
      <p class="src">${mark(d.en,true)}</p>
      <p class="tgt ${hide?"hidden":""}" data-rev="${d.id}">${blank?t("noTgt"):esc(tgt)}</p>
      <div class="row" style="margin-top:12px">
        <button data-speak="${d.id}">${t("play")}</button>
        <button data-master="${d.id}">${d.mastered?t("unmaster"):t("master")}</button>
        <button data-edit="${d.id}">${t("edit")}</button>
      </div></div>`;
  }).join("");
}

document.getElementById("view").addEventListener("click",e=>{
  const x=e.target;
  if(x.dataset.rev){const i=/^s/.test(x.dataset.rev)?x.dataset.rev:+x.dataset.rev;
    revealed.has(i)?revealed.delete(i):revealed.add(i);render()}
  if(x.dataset.speak)speak(+x.dataset.speak);
  if(x.dataset.master){const d=data.find(y=>y.id===+x.dataset.master);
    d.mastered=!d.mastered;save();render()}
  if(x.dataset.edit)openEdit(+x.dataset.edit);
  if(x.dataset.rate){const it=visible();rate(it[Math.min(idx,it.length-1)],+x.dataset.rate)}
});

function speak(id){
  const d=data.find(x=>x.id===id);if(!d)return;
  speechSynthesis.cancel();paused=false;
  const txt=optSplit?(sentences(d.en)[chunkIdx]||d.en):d.en;
  const u=new SpeechSynthesisUtterance(txt);
  u.lang="en-US";u.rate=parseFloat(document.getElementById("rate").value);
  speechSynthesis.speak(u);
}
function togglePause(){
  if(speechSynthesis.paused){speechSynthesis.resume();paused=false}
  else if(speechSynthesis.speaking){speechSynthesis.pause();paused=true}
  const b=document.getElementById("pause");if(b)b.textContent=paused?t("resume"):t("pause");
}
function playback(){const a=document.getElementById("pb");if(a){a.currentTime=0;a.play()}}
function go(n){stopRec();recBlob=null;idx+=n;chunkIdx=0;render()}

function rate(d,q){
  d.ivl=q===1?1:q===2?Math.max(2,Math.round((d.ivl||1)*1.7)):Math.max(4,Math.round((d.ivl||2)*2.5));
  d.due=Date.now()+d.ivl*DAY;save();
  const it=visible();
  if(idx>=it.length-1){idx=0;revealed.clear();render()}else go(1);
}

async function toggleRec(id){
  if(recorder){stopRec();return}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const chunks=[];recorder=new MediaRecorder(stream);
    recorder.ondataavailable=e=>chunks.push(e.data);
    recorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());
      recBlob=URL.createObjectURL(new Blob(chunks,{type:"audio/webm"}));
      recFor=id;recorder=null;render()};
    recorder.start();render();
  }catch(e){alert(t("micFile"));recorder=null}
}
function stopRec(){if(recorder&&recorder.state!=="inactive")recorder.stop()}

document.addEventListener("keydown",e=>{
  if(document.getElementById("dlg").open)return;
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;
  if(mode!=="focus")return;
  const items=visible();if(!items.length)return;
  const d=items[Math.min(idx,items.length-1)],k=e.key.toLowerCase();
  if(e.code==="Space"){e.preventDefault();revealed.has(d.id)?revealed.delete(d.id):revealed.add(d.id);render()}
  else if(e.key==="ArrowRight"&&idx<items.length-1)go(1);
  else if(e.key==="ArrowLeft"&&idx>0)go(-1);
  else if(k==="r")speak(d.id);
  else if(k==="p"){e.preventDefault();togglePause()}
  else if(k==="c"&&optSplit){chunkIdx=(chunkIdx+1)%Math.max(1,sentences(d.en).length);render()}
  else if(k==="n"){e.preventDefault();const p=document.getElementById("pad");if(p)p.focus()}
  else if(k==="v")toggleRec(d.id);
  else if(k==="b")playback();
  else if(k==="s"){const s="s"+d.id;revealed.has(s)?revealed.delete(s):revealed.add(s);render()}
  else if("123".includes(e.key))rate(d,+e.key);
});

const F={cat:"f-cat",en:"f-en",zh:"f-zh",zht:"f-zht"};
let editing=null;
function openEdit(id){
  editing=id;
  const d=id?data.find(x=>x.id===id):{cat:"",en:"",zh:"",zht:""};
  for(const k in F)document.getElementById(F[k]).value=d[k]||"";
  document.getElementById("f-del").style.display=id?"":"none";
  document.getElementById("dlg").showModal();
}
document.getElementById("dlg").addEventListener("close",function(){
  const v=this.returnValue,en=document.getElementById("f-en").value.trim();
  if(v==="save"&&en){
    const o={};for(const k in F)o[k]=document.getElementById(F[k]).value.trim();
    if(editing)Object.assign(data.find(x=>x.id===editing),o);
    else data.push({id:Date.now(),...o,mastered:false,due:0,ivl:0,notes:""});
    save();
  }
  if(v==="delete"&&editing)data=data.filter(x=>x.id!==editing),save();
  editing=null;order=null;render();
});

const bind=(id,set)=>{const c=document.getElementById(id);
  c.onchange=()=>{set(c.checked);order=null;idx=0;chunkIdx=0;render()}};
bind("c-due",v=>optDue=v);bind("c-done",v=>optDone=v);
bind("c-shuffle",v=>optShuffle=v);bind("c-split",v=>optSplit=v);bind("c-hl",v=>optHL=v);

const T$=(id,fn)=>document.getElementById(id).onclick=fn;
T$("ui",()=>{ui=ui==="en"?"zh":"en";localStorage.setItem("dt_ui",ui);render()});
T$("t-set",()=>document.getElementById("drawer").classList.toggle("open"));
T$("t-script",()=>{useT=!useT;render()});
T$("t-add",()=>openEdit(null));
T$("m-focus",()=>{mode="focus";stopRec();speechSynthesis.cancel();
  document.getElementById("m-focus").classList.add("on");
  document.getElementById("m-list").classList.remove("on");render()});
T$("m-list",()=>{mode="list";stopRec();speechSynthesis.cancel();
  document.getElementById("m-list").classList.add("on");
  document.getElementById("m-focus").classList.remove("on");render()});
T$("t-prt",()=>{const k=optDue,j=optDone,m=mode;
  optDue=false;optDone=true;mode="list";render();window.print();
  optDue=k;optDone=j;mode=m;render()});
T$("t-exp",()=>{const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));
  a.download="disclosure-passages.json";a.click()});
T$("t-imp",()=>{
  const i=document.createElement("input");i.type="file";i.accept=".json";
  i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{
      const a=JSON.parse(r.result);
      if(!Array.isArray(a))return alert(t("impBad"));
      let add=0,upd=0,skip=0;
      a.forEach(d=>{
        if(!d.en||!d.en.trim()){skip++;return}
        const same=data.find(x=>x.id===d.id||x.en.trim()===d.en.trim());
        if(same){if(!same.zh.trim()&&d.zh)same.zh=d.zh;
          if(!(same.zht||"").trim()&&d.zht)same.zht=d.zht;
          if(!same.cat&&d.cat)same.cat=d.cat;upd++}
        else{data.push({id:d.id??Date.now()+Math.random(),cat:d.cat||"",en:d.en,
          zh:d.zh||"",zht:d.zht||"",mastered:false,due:0,ivl:0,notes:""});add++}
      });
      save();idx=0;order=null;render();alert(t("impDone")(add,upd,skip));
    }catch(e){alert(t("impBad"))}};
    r.readAsText(f)};
  i.click()});

const rt=document.getElementById("rate");
rt.oninput=()=>document.getElementById("rateval").textContent=(+rt.value).toFixed(1)+"x";
document.getElementById("cat").onchange=()=>{idx=0;order=null;render()};
document.getElementById("q").oninput=()=>{idx=0;order=null;render()};

render();
</script>
</body>
